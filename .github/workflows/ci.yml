name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l
      - name: Run tests
        run: php tests/run.php

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build twice and verify reproducibility
        run: |
          ./scripts/build-plugin.sh
          first=$(sha256sum dist/webvouch-for-woocommerce-*.zip | grep -v 'webvouch-for-woocommerce.zip' | awk '{print $1}')
          ./scripts/build-plugin.sh
          second=$(sha256sum dist/webvouch-for-woocommerce-*.zip | grep -v 'webvouch-for-woocommerce.zip' | awk '{print $1}')
          test "$first" = "$second"
      - uses: actions/upload-artifact@v4
        with:
          name: webvouch-for-woocommerce
          path: |
            dist/webvouch-for-woocommerce-*.zip
            dist/latest.json
            dist/SHA256SUMS
          if-no-files-found: error

